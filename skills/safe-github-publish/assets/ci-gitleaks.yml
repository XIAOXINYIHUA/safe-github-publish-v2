# CI 密钥扫描 —— 复制到用户仓库 .github/workflows/gitleaks.yml
# fetch-depth: 0 让 gitleaks 扫描全部历史
# 仓库属于 organization 时 gitleaks-action 需要免费许可证：在 gitleaks.io 申请后存为仓库 secret GITLEAKS_LICENSE；个人账号无需
# action 固定到 commit SHA（标签可被改写），版本由 Dependabot 跟进
name: secret-scan
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
